<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Standalone Hello World page" />
    <title>Hello World</title>
    <style>
      :root {
        --bg: #f9fafb;
        --surface: #ffffff;
        --text: #111827;
        --muted: #64748b;
        --primary: #3b82f6;
        --border: rgba(17, 24, 39, 0.12);
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: radial-gradient(
            1200px 700px at 30% 10%,
            rgba(59, 130, 246, 0.12),
            transparent 55%
          ),
          radial-gradient(900px 600px at 70% 0%, rgba(6, 182, 212, 0.1), transparent 55%), var(--bg);
        display: grid;
        place-items: center;
        padding: 24px 14px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 18px 16px;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        text-decoration: underline;
      }

      .links {
        margin-top: 14px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-label="Hello World page">
      <h1>Hello World</h1>
      <p>
        This is a standalone static HTML page served from the React app’s <code>public/</code> folder.
        It does not affect the main React entrypoint.
      </p>

      <nav class="links" aria-label="Links">
        <a href="/">Go to React app</a>
        <a href="/hello.html" aria-current="page">Reload this page</a>
      </nav>
    </main>
  </body>
</html>
