<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        background: #f9fafb;
        color: #111827;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      main {
        width: 100%;
        max-width: 720px;
        background: #ffffff;
        border: 1px solid rgba(100, 116, 139, 0.25);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
        padding: 18px 16px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 10px 0 0;
        color: #64748b;
        line-height: 1.5;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 0.95em;
      }
    </style>
  </head>

  <body>
    <main aria-label="Hello World page">
      <h1>Hello World</h1>
      <p>
        This is a standalone static HTML file located at <code>frontend/public/hello-world.html</code>.
        It does not affect the React app entrypoint.
      </p>
    </main>
  </body>
</html>
